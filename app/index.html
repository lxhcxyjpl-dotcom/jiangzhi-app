var OB_I=0;
function openOnboard(){ OB_I=0; var el=$("#onboard"); if(el){ el.classList.add("show"); obRender(); } }
function closeOnboard(){ var el=$("#onboard"); if(el) el.classList.remove("show"); }
function obFinish(){ S.settings.onboarded=true; persist(); closeOnboard(); }
function obRender(){
  var st=OB_STEPS[OB_I];
  $("#obIllus").innerHTML=obIllusSvg(OB_I);
  var dots="";
  for(var i=0;i<OB_STEPS.length;i++){ dots+='<span class="ob-dot'+(i===OB_I?" on":"")+'"></span>'; }
  $("#obDots").innerHTML=dots;
  $("#obTitle").textContent=st.title;
  $("#obBody").textContent=st.body;
  var last=(OB_I===OB_STEPS.length-1);
  $("#obNav").innerHTML= last
    ? '<button class="btn btn-soft btn-sm" data-act="obDemo">先看演示</button><button class="btn btn-primary" data-act="obNext">开始使用</button>'
    : '<button class="btn btn-ghost btn-sm" data-act="obSkip">跳过</button><button class="btn btn-primary" data-act="obNext">下一步 →</button>';
}
function obNext(){ if(OB_I>=OB_STEPS.length-1){ obFinish(); return; } OB_I++; obRender(); }

/* ============ 交互式新手引导 ============ */
var RECAP=[
  {title:"少开几场公投", body:"那篇文章的核心：真正的问题不是「怎么赢下每次选择」，而是「哪些选择根本不需要发生」。这个 App 的执行清单，就是帮你把「今晚先做什么」的决定提前做完。"},
  {title:"骗自己跑两步", body:"「我这么喜欢跑步，跑两步怎么了？」——专注页那句提示语，就是借来的理由。先动起来，后面的事后面再说。"},
  {title:"检查点，把脑子接回来", body:"一段做完，把完整的脑子接回来：有没有新信息、真实推进了什么、下一步做什么。这三个问题，就是 App 的结束三问。"},
  {title:"让证据接管", body:"真实的进步标成 ✦ 证据，会变成「回顾」页夜空里的星星。以后，是它们替你说话。"}
];
var TOUR=null;
var _tourPaused=null;
var _widgetWasVisible=false;
function tourStart(){ TOUR={step:1, waiting:false, phase:"recap"}; S.settings.onboarded=true; persist(); tourShow(); }
function tourSkip(){ TOUR=null; var t=$("#tour"); if(t) t.classList.remove("show"); }
function tourShow(){
  var t=$("#tour"); if(!t) return;
  t.classList.add("show");
  var hole=$("#tourHole"), bub=$("#tourBubble");
  var st=TOUR.step;
  if(TOUR.phase==="recap"){
    hole.style.display="none";
    var rp=RECAP[st-1];
    bub.innerHTML='<div class="tb-top"><span class="tb-badge">文章回顾 '+st+'/'+RECAP.length+'</span><div class="tb-title">'+rp.title+'</div></div>'
      +'<div class="tb-body">'+rp.body+'</div>'
      +'<div class="tb-nav"><button class="btn btn-ghost btn-sm" data-act="tourSkip">跳过</button><button class="btn btn-primary btn-sm" data-act="tourNext">'+(st>=RECAP.length?"开始走一圈 →":"下一篇 →")+'</button></div>';
    bub.style.left="50%"; bub.style.top="50%"; bub.style.transform="translate(-50%,-50%)";
    bub.style.width="";
    return;
  }
  if(st===1){
    hole.style.display="none";
    bub.innerHTML='<div class="tb-top"><span class="tb-badge">✦</span><div class="tb-title">三句话，带你用起来</div></div>'
      +'<div class="tb-body">写一个「手能直接伸向」的动作 → 点 ▶ 开始，专注一段 → 结束时回答三个小问题。进展会自己记下来，标成 ✦ 会变成星星。</div>'
      +'<div class="tb-nav"><button class="btn btn-ghost btn-sm" data-act="tourSkip">跳过</button><button class="btn btn-primary btn-sm" data-act="tourNext">开始走一圈 →</button></div>';
    bub.style.left="50%"; bub.style.top="50%"; bub.style.transform="translate(-50%,-50%)";
    return;
  }
  var sel = st===2 ? '#view [data-act="newPoint"]'
    : (st===3 ? '#view .next-card [data-act="start"], #view .point-row [data-act="start"]'
    : (st===4 ? '#navTabs [data-view="records"]' : '#navTabs [data-view="retro"]'));
  var target=$(sel);
  hole.style.display="block";
  bub.style.transform="none";
  var titles={2:"写一个执行点",3:"开始一段",4:"你的记录",5:"你的星空"};
  var bodies={
    2:"它只问三件事：做什么、做到哪、多久检查。随便写一个，真实的感觉才真实。",
    3:"写好后点 ▶：进入专注，只有倒计时和一句提示语。结束后的三问，也点一遍试试。",
    4:"你完成的专注会自动记在这里。有空时把值得的进展标成 ✦ 证据。",
    5:"证据会变成「回顾」页夜空里的星星。点进去看一眼。"
  };
  var ops={
    2:"点这个按钮试试，随便写一个",
    3:"点 ▶ 开始一段试试",
    4:"点开「记录」看看",
    5:"点开「回顾」看看"
  };
  if(!target){
    hole.style.display="none";
    bub.innerHTML='<div class="tb-top"><span class="tb-badge">'+st+'</span><div class="tb-title">'+titles[st]+'</div></div><div class="tb-body">'
      +(st===2?"页面上方有一个「＋ 手动写执行点」按钮，点它就能写第一个动作。":(st===3?"先写一个执行点，再点它的 ▶ 开始一段。":"在页面顶部的标签里。"))+'</div>'
      +'<div class="tb-nav"><button class="btn btn-ghost btn-sm" data-act="tourSkip">先跳过</button></div>';
    bub.style.left="50%"; bub.style.top="50%"; bub.style.transform="translate(-50%,-50%)";
    return;
  }
  var r=target.getBoundingClientRect();
  hole.style.left=(r.left-6)+"px"; hole.style.top=(r.top-6)+"px";
  hole.style.width=(r.width+12)+"px"; hole.style.height=(r.height+12)+"px";
  bub.innerHTML='<div class="tb-top"><span class="tb-badge">'+st+'</span><div class="tb-title">'+titles[st]+'</div></div>'
    +'<div class="tb-body">'+bodies[st]+'</div>'
    +'<div class="tb-op">👆 '+ops[st]+'</div>'
    +'<div class="tb-nav"><button class="btn btn-ghost btn-sm" data-act="tourSkip">先跳过</button></div>';
  var bw=Math.min(340, window.innerWidth-24);
  var x=r.left+r.width/2-bw/2;
  x=Math.max(12, Math.min(x, window.innerWidth-bw-12));
  var y=r.bottom+14;
  if(y+190>window.innerHeight){ y=Math.max(12, r.top-14-190); }
  bub.style.left=x+"px"; bub.style.top=y+"px"; bub.style.width=bw+"px";
}
function tourNext(){
  if(TOUR.phase==="recap"){
    if(TOUR.step<RECAP.length){ TOUR.step++; }
    else { TOUR.phase="tour"; TOUR.step=1; }
    tourShow();
    return;
  }
  TOUR.step++; tourShow();
}
function tourOnAct(step){
  if(!TOUR || TOUR.step!==step) return;
  if(step===2 || step===3){ TOUR.waiting=true; var t=$("#tour"); if(t) t.classList.remove("show"); return; }
  if(step===4){ TOUR.step=5; tourShow(); return; }
  if(step===5){ TOUR=null; var t2=$("#tour"); if(t2) t2.classList.remove("show"); toast("走完一圈了。设置里随时可以再看一次。"); }
}
function tourResume(){
  if(!TOUR || !TOUR.waiting) return;
  TOUR.waiting=false;
  if(TOUR.step===2) TOUR.step=3;
  else if(TOUR.step===3) TOUR.step=4;
  tourShow();
}

/* ============ 初始化 ============ */
function hydrateSession(){
  var cs=S.currentSession;
  if(cs && cs.status==="running" && !cs.reviewing && Date.now()>=cs.endAt){
    cs.overtime=true; cs.timedOut=true; timedOutFired=true;
    persist();
  }
}
function bindKeys(){
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){
      var ob=$("#tour");
      if(ob && ob.classList.contains("show")){ tourSkip(); return; }
      var pl=$("#play");
      if(pl && pl.classList.contains("show")){ stopPlay(); return; }
      var m=$("#modal");
      if(m && m.classList.contains("show") && m.getAttribute("data-review")!=="1") closeModal();
    }
  });
  var play=$("#play");
  if(play && !play._bound){ play._bound=true; play.addEventListener("click", function(){ stopPlay(); }); }
}
async function init(){
  try{
    if(IS_DESKTOP){ S=await window.desktopAPI.loadStore(); }
    else { try{ S=JSON.parse(localStorage.getItem("jiangzhi")||"null"); }catch(e){ S=null; } }
    S=normalize(S);
    seedCues();
    hydrateSession();
    if(IS_DESKTOP){
      window.desktopAPI.onStateChanged(function(store){
        var wasReview = S.currentSession && S.currentSession.reviewing;
        var sameReview = wasReview && store.currentSession && store.currentSession.reviewing && store.currentSession.id === S.currentSession.id;
        S=normalize(store);
        if(sameReview) return;
        renderAll();
      });
      var icon=makeTrayIcon();
      if(icon) window.desktopAPI.sendTrayIcon(icon);
    }
    bindKeys();
    renderAll();
    if(!IS_WIDGET && !S.settings.onboarded){ tourStart(); }
    try{ if(window.matchMedia){ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){ if(S.settings.theme==="auto") applyTheme(); }); } }catch(e){}
    if(IS_DESKTOP && window.desktopAPI.smokeReady) window.desktopAPI.smokeReady();
  }catch(err){
    console.error("init error", err);
    if(IS_DESKTOP && window.desktopAPI.smokeError) window.desktopAPI.smokeError(String(err&&err.message||err));
  }
}
if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", init); } else { init(); }
</script>
