<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主动降智 · 把脑子用在该用的时候</title>
<link rel="icon" href="../icon.ico">
<style>
/* ============ 设计令牌 ============ */
:root{
  --paper:#F6F0E3; --paper-2:#FBF7EC; --card:#FFFCF5;
  --ink:#27211A; --ink-2:#7A6E5C; --ink-3:#AA9E88;
  --accent:#E2602F; --accent-deep:#C14F24; --accent-soft:#F6E3D7;
  --line:#E8DFCC; --line-2:#F0E9D9;
  --ok:#5E8A5A; --warn:#B98A2F;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
  --hand:"Kaiti SC","STKaiti",KaiTi,"FangSong",FangSong_GB2312,serif;
  --r:16px; --r-s:10px;
  --shadow:0 1px 2px rgba(80,55,20,.04),0 8px 28px rgba(80,55,20,.07);
  --shadow-lg:0 4px 12px rgba(80,55,20,.08),0 24px 64px rgba(80,55,20,.14);
  --focus-grad:linear-gradient(178deg,#FBF6EA 0%,#F3EAD9 55%,#EBDEC5 100%);
  --ev-grad:linear-gradient(135deg,#FDF1E7,#FBEDE0);
  --dr-grad:linear-gradient(180deg,#FFFDF8,#FAF5EA);
  --toast-bg:var(--ink); --toast-fg:#F6EFDF;
}
body.dark{
  --paper:#1D1812; --paper-2:#251F17; --card:#2B241B;
  --ink:#EDE3CF; --ink-2:#A99A7F; --ink-3:#7B6E58;
  --accent:#EE7C4C; --accent-deep:#F29A67; --accent-soft:#3B2B1E;
  --line:#41362A; --line-2:#352C21;
  --ok:#8FB27F; --warn:#D9B45C;
  --focus-grad:linear-gradient(178deg,#251F16 0%,#1F1A12 55%,#191510 100%);
  --ev-grad:linear-gradient(135deg,#372A1D,#2E2318);
  --dr-grad:linear-gradient(180deg,#2E261C,#262018);
  --toast-bg:#EFE5D2; --toast-fg:#241C12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
  --shadow-lg:0 4px 12px rgba(0,0,0,.35),0 24px 64px rgba(0,0,0,.5);
}
body.dark::before{background:repeating-linear-gradient(0deg,rgba(230,205,160,.014) 0 1px,transparent 1px 3px),
  radial-gradient(1200px 600px at 50% -10%,rgba(238,124,76,.07),transparent 60%)}
body.dark .evidence-card{border-color:#4A3A28}
body.dark .dr-card{border-color:#453A2B}
body.dark .switch i{background:#57483A}
body.dark ::-webkit-scrollbar-thumb{background:#4A3F2E;border-color:var(--paper)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,rgba(96,66,24,.016) 0 1px,transparent 1px 3px),
  radial-gradient(1200px 600px at 50% -10%,rgba(226,96,47,.05),transparent 60%);}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#D8CCB4;border-radius:6px;border:2px solid var(--paper)}
::-webkit-scrollbar-track{background:transparent}

/* ============ 基础件 ============ */
.app{max-width:780px;margin:0 auto;padding:30px 22px 90px;position:relative;z-index:1}
#view{animation:viewIn .24s ease}
#aiInput{animation:viewIn .2s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:30px;flex-wrap:wrap}
.brand h1{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:.08em;line-height:1.3}
.brand .sub{color:var(--ink-2);font-size:12px;margin-top:3px;letter-spacing:.04em}
.brand .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:9px;vertical-align:3px}
.tabs{display:flex;gap:3px;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;padding:7px 18px;border-radius:999px;font-size:13.5px;color:var(--ink-2);transition:all .16s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--ink);color:var(--paper-2);font-weight:600}
.widget-toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper-2);
  color:var(--ink-2);border-radius:999px;padding:7px 14px;font-size:12.5px;transition:all .16s}
.widget-toggle:hover{border-color:var(--accent);color:var(--accent-deep)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow)}
.h-label{font-size:11.5px;letter-spacing:.22em;color:var(--ink-3);text-transform:uppercase;margin-bottom:10px;font-weight:600}
.h-serif{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.5}
.muted{color:var(--ink-2);font-size:13px}
.tiny{color:var(--ink-3);font-size:12px}
.qline{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-s) var(--r-s) 0;
  padding:10px 14px;margin:12px 0;color:var(--accent-deep);font-family:var(--serif);font-size:15px}
.foot-quote{margin-top:54px;text-align:center;color:var(--ink-3);font-family:var(--serif);font-size:13px;letter-spacing:.1em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:11px 20px;
  font-size:14.5px;border:1px solid transparent;transition:all .16s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:#FFF7EC;font-weight:600;box-shadow:0 3px 12px rgba(226,96,47,.28)}
.btn-primary:hover{background:var(--accent-deep)}
.btn-soft{background:var(--paper-2);border-color:var(--line);color:var(--ink)}
.btn-soft:hover{border-color:var(--accent);color:var(--accent-deep)}
.btn-ink{background:var(--ink);color:var(--paper-2)}
.btn-ink:hover{opacity:.88}
.btn-ghost{background:none;color:var(--ink-2)}
.btn-ghost:hover{color:var(--ink)}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper-2);
  border-radius:999px;padding:6px 15px;font-size:13px;color:var(--ink-2);cursor:pointer;transition:all .14s;user-select:none}
.chip:hover{border-color:var(--accent);color:var(--accent-deep)}
.chip.on,.chip:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}

.inp,.txa,.sel{width:100%;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;
  outline:none;transition:border .15s,box-shadow .15s}
.inp:focus,.txa:focus,.sel:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(226,96,47,.13);background:#FFFDF8}
.txa{resize:vertical;min-height:86px;line-height:1.6}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.field .hint{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.divider{height:1px;background:var(--line-2);margin:20px 0}

/* ============ 今天 ============ */
.day-head{margin-bottom:18px}
.day-head .date{font-family:var(--serif);font-size:15px;color:var(--ink-2);letter-spacing:.06em}
.day-head .greet{font-family:var(--serif);font-size:30px;font-weight:700;margin-top:4px}
.evidence-card{border:1px solid #F0D4C3;background:var(--ev-grad);border-radius:var(--r);
  padding:16px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
.evidence-card .ev-label{font-size:11px;letter-spacing:.24em;color:var(--accent-deep);font-weight:700}
.evidence-card .ev-body{margin-top:8px;font-family:var(--serif);font-size:15.5px;line-height:1.7}
.evidence-card .ev-meta{margin-top:8px;font-size:12px;color:var(--ink-2)}
.next-card{padding:26px 24px;margin-bottom:18px}
.next-card .nl{font-size:11.5px;letter-spacing:.24em;color:var(--accent-deep);font-weight:700}
.next-card .np{font-family:var(--serif);font-size:22px;font-weight:700;margin:8px 0 4px;line-height:1.55}
.next-card .nm{font-size:12.5px;color:var(--ink-2);margin-bottom:16px}
.task-block{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0 12px 12px;margin-bottom:14px;box-shadow:var(--shadow)}
.task-block .task-head{background:var(--paper-2);margin:0 -12px 10px;padding:8px 12px;border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.task-head{display:flex;align-items:center;gap:10px;padding:4px 2px 8px;flex-wrap:wrap}
.task-head .tt{font-family:var(--serif);font-size:17px;font-weight:700;flex:1;min-width:0}
.task-head .cnt{font-size:11.5px;color:var(--ink-3);background:var(--paper-2);border:1px solid var(--line);
  border-radius:999px;padding:1px 9px}
.iconbtn{border:0;background:none;color:var(--ink-3);border-radius:9px;padding:6px 10px;font-size:15px;transition:all .14s}
.iconbtn:hover{background:var(--paper-2);color:var(--accent-deep)}
.point-row{display:flex;align-items:flex-start;gap:12px;padding:9px 10px;border-radius:0 10px 10px 0;transition:background .14s,border-color .14s;
  background:var(--paper-2);border:1px solid var(--line);border-left:3px solid #E3D5BC;margin-bottom:6px;margin-left:14px}
.point-row:hover{background:var(--card)}
.point-row .pi{cursor:grab}
.point-row.dragging{opacity:.45}
.point-row .go{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:#FFF7EC;
  font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(226,96,47,.3);transition:all .15s}
.point-row .go:hover{background:var(--accent-deep);transform:scale(1.05)}
.point-row .pi{flex:1;min-width:0}
.point-row .pt{font-size:14.5px;line-height:1.55;word-break:break-word}
.point-row .pm{font-size:12px;color:var(--ink-3);margin-top:3px;word-break:break-word}
.point-row.done .pt{color:var(--ink-3);text-decoration:line-through;text-decoration-color:#C9BBA2}
.point-row .pa{display:flex;gap:2px;flex:none;opacity:0;transition:opacity .14s}
.point-row:hover .pa{opacity:1}
.check{border:1.5px solid var(--line);background:var(--paper-2);width:21px;height:21px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:11px;transition:all .15s;flex:none;margin-top:6px}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.done-list{margin-top:6px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:34px 24px;text-align:center;color:var(--ink-2)}
.empty .eh{font-family:var(--serif);font-size:17px;margin-bottom:6px}
.empty .em{font-size:13px;margin-bottom:16px;line-height:1.7}

/* ============ 记录 ============ */
.dr-card{border:1px solid #D9CFB8;background:var(--dr-grad);border-radius:var(--r);padding:20px 22px;margin-bottom:20px;box-shadow:var(--shadow)}
.dr-card .dq{font-family:var(--serif);font-size:15px;margin:14px 0 6px;font-weight:600}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.daygroup{margin-bottom:26px}
.daytitle{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px}
.daytitle .dt{font-family:var(--serif);font-size:16px;font-weight:700}
.daytitle .dl{flex:1;height:1px;background:var(--line)}
.rec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(80,55,20,.04)}
.rec .rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rec .rrange{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);background:var(--paper-2);border:1px solid var(--line);border-radius:7px;padding:2px 9px}
.badge{font-size:11px;border-radius:999px;padding:2px 10px;font-weight:600}
.badge.done{background:#E9F0E3;color:var(--ok)}
.badge.failed{background:#F2E7D2;color:#A0772C}
.badge.ev{background:var(--accent-soft);color:var(--accent-deep)}
.rec .rt{font-size:14.5px;font-weight:600;margin:8px 0 2px;word-break:break-word}
.rec .rp{font-size:12.5px;color:var(--ink-3);word-break:break-word}
.rec .rcue{font-size:12.5px;color:var(--ink-2);font-family:var(--serif);margin-top:6px;font-style:italic}
.rec .rnote{margin-top:8px;font-size:13.5px;background:var(--paper-2);border-radius:10px;padding:8px 12px;word-break:break-word}
.rec .rne{color:var(--accent-deep)}
.rec .rnext{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.rec .ract{display:flex;gap:4px;margin-top:10px}
.star{color:var(--ink-3);transition:all .14s;font-size:15px}
.star.on{color:var(--accent)}
.rdot{width:8px;height:8px;border-radius:50%;flex:none}
.rdot.done{background:var(--ok)}
.rdot.failed{background:#C9A15C}
.rdot.note{background:var(--accent)}
.rdot.reflect{background:var(--accent)}
.tagchip{font-size:11px;border-radius:999px;padding:1px 10px;border:1px solid var(--line);color:var(--ink-2);flex:none}
.tagchip.tag-progress{border-color:#B9CDAE;color:var(--ok)}
.tagchip.tag-stuck{border-color:#DDBE96;color:#A8482B}
.tagchip.tag-reflect{border-color:var(--accent);color:var(--accent-deep)}
.rec-details{border-top:1px dashed var(--line-2);margin-top:8px;padding-top:8px;font-size:12.5px;color:var(--ink-2);display:none;line-height:1.8;word-break:break-word}
.rec-details.on{display:block}

/* ============ 设置 ============ */
.set-group{margin-bottom:22px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line-2)}
.set-row:last-child{border-bottom:0}
.set-row .sl{font-size:14px}
.set-row .sh{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;border-radius:999px;background:#D8CCB4;transition:.18s}
.switch i::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{left:21px}
.cue-list .cue-line{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--line-2)}
.cue-list .cue-line:last-child{border-bottom:0}
.cue-list .ctext{flex:1;font-family:var(--serif);font-size:14px;word-break:break-word}

/* ============ 专注页 ============ */
#focus{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:30px;text-align:center;
  background:var(--focus-grad);}
#focus.show{display:flex}
#focus .f-task{font-size:14px;color:var(--ink-2);letter-spacing:.05em;margin-bottom:6px;max-width:640px}
#focus .f-cue{font-family:var(--serif);font-size:clamp(26px,4.4vw,42px);font-weight:700;line-height:1.8;color:var(--accent-deep);max-width:780px;margin-bottom:10px}
#focus .f-ev{font-size:12.5px;color:var(--ink-2);max-width:560px;margin-bottom:4px}
#focus .f-timer.over,.wTimer.over{color:var(--accent-deep)}
.f-timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(72px,15vw,128px);
  font-weight:600;letter-spacing:.05em;color:var(--ink);margin:10px 0 6px}
#focus .f-actions{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;justify-content:center}
#focus .f-fail{margin-top:26px;font-size:12.5px;color:var(--ink-3);background:none;border:0;text-decoration:underline dashed;text-underline-offset:4px;cursor:pointer}
#focus .f-fail:hover{color:var(--accent-deep)}
#focus .failbox{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;max-width:460px;box-shadow:var(--shadow)}
#focus .failbox .fq{font-size:13.5px;margin-bottom:12px;line-height:1.7}
@keyframes flashPulse{0%,100%{background:var(--focus-grad)}50%{background:#FBDCC8}}
#focus.flash{animation:flashPulse 1.2s ease 2}

/* ============ 弹层 ============ */
#modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(52,38,18,.32);backdrop-filter:blur(3px)}
#modal.show{display:flex}
.modal-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;
  max-height:min(88vh,760px);display:flex;flex-direction:column;animation:pop .18s ease}
.modal-card.wide{max-width:680px}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 12px}
.modal-head .mt{font-family:var(--serif);font-size:19px;font-weight:700}
.modal-head .ms{font-size:12px;color:var(--ink-3);margin-top:3px}
.modal-body{padding:8px 24px 12px;overflow-y:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:14px 24px 22px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.modal-foot .left{flex:1;text-align:left;font-size:12px;color:var(--ink-3)}
.qblock{margin-bottom:18px}
.qblock .qn{font-family:var(--serif);font-size:15px;font-weight:700;margin-bottom:4px}
.qblock .qn .n{color:var(--accent-deep);margin-right:6px}
.rw-dots{display:flex;gap:6px;justify-content:center;margin:2px 0 16px}
.rw-dot{width:7px;height:7px;border-radius:999px;background:var(--line);transition:all .22s}
.rw-dot.on{background:var(--accent);width:18px}
.rw-step{display:none}
.rw-step.on{display:block;animation:viewIn .2s ease}
.rw-nav{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.rw-err{display:none;color:#A8482B;background:#F6E4DC;border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:10px}

/* ============ AI ============ */
.ai-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.ai-tab{border:1px solid var(--line);background:var(--paper-2);color:var(--ink-2);border-radius:10px;padding:7px 14px;font-size:13px}
.ai-tab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.ai-task{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:var(--paper-2)}
.ai-task .ai-th{display:flex;gap:8px;margin-bottom:10px}
.ai-point{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.ai-point .inp{padding:8px 11px;font-size:13px}
.ai-point .sel{width:auto;flex:none;padding:8px 6px;font-size:13px}
.ai-point .mv{flex:none;border:0;background:none;color:var(--ink-3);font-size:12px;padding:4px 6px;border-radius:7px}
.ai-point .mv:hover{background:var(--line-2);color:var(--accent-deep)}
.ai-questions{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.ai-questions .aq{font-size:13px;color:var(--ink-2);margin:10px 0 6px}
.ai-loading{display:flex;align-items:center;gap:12px;padding:26px 8px;color:var(--ink-2)}
.ai-loading .spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ============ 桌面组件 ============ */
#widgetRoot{display:none}
body.is-widget #widgetRoot{display:block}
body.is-widget .app,body.is-widget #focus,body.is-widget #modal{display:none!important}
body.is-widget{background:transparent;user-select:none}
body.is-widget input,body.is-widget textarea,body.is-widget select{user-select:text}

<script>
"use strict";
/* ============ 环境 ============ */
var IS_DESKTOP = !!(window.desktopAPI && window.desktopAPI.isDesktop);
var IS_WIDGET = (new URLSearchParams(location.search).get("window") === "widget");
document.body.classList.toggle("is-widget", IS_WIDGET);
document.body.classList.toggle("is-main", !IS_WIDGET);

/* ============ 工具 ============ */
function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function pad2(n){ return (n<10?"0":"")+n; }
function fmtClock(ms){ var t=Math.max(0,Math.ceil(ms/1000)); return pad2(Math.floor(t/60))+":"+pad2(t%60); }
function fmtTime(ts){ var d=new Date(ts); return pad2(d.getHours())+":"+pad2(d.getMinutes()); }
var WD=["日","一","二","三","四","五","六"];
function dayKey(ts){ var d=new Date(ts); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayKey(){ return dayKey(Date.now()); }
function fmtDay(ts){ var d=new Date(ts); return (d.getMonth()+1)+"月"+d.getDate()+"日 · 周"+WD[d.getDay()]; }
function greeting(){ var h=new Date().getHours(); if(h<5) return "夜深了"; if(h<9) return "早上好"; if(h<12) return "上午好"; if(h<14) return "中午好"; if(h<18) return "下午好"; if(h<23) return "晚上好"; return "夜深了"; }

/* ============ 存储 ============ */
var S = null;
function defaultStore(){ return {
  schema_version:1,
  settings:{ apiKey:"", defaultMinutes:25, sound:true, cueVisible:true, widgetOpacity:0.97, theme:"light", fontScale:1, onboarded:false, dailyRemind:{ enabled:false, time:"21:30", lastFired:"" } },
  tasks:[], points:[], cues:[], sessions:[], evidence:[], journals:[], dailyReviews:[],
  currentSession:null, aiWeekly:null
}; }
function normalize(s){
  var d=defaultStore(), k;
  if(!s || typeof s!=="object") s=d;
  for(k in d){ if(!(k in s)) s[k]=d[k]; }
  s.settings=Object.assign({}, d.settings, s.settings||{});
  s.settings.dailyRemind=Object.assign({}, d.settings.dailyRemind, s.settings.dailyRemind||{});
  ["tasks","points","cues","sessions","evidence","journals","dailyReviews"].forEach(function(key){ if(!Array.isArray(s[key])) s[key]=[]; });
  return s;
}
function persist(){
  S.schema_version=1;
  if(IS_DESKTOP){ window.desktopAPI.saveStore(S).catch(function(){}); }
  else { try{
    var prev=localStorage.getItem("jiangzhi");
    var nxt=JSON.stringify(S);
    if(prev && prev!==nxt){ try{ localStorage.setItem("jiangzhi.backup", prev); }catch(e2){} }
    localStorage.setItem("jiangzhi", nxt);
  }catch(e){} }
}
var SEED_CUES=["我本来就挺喜欢它的，先做两步怎么了？","先借一个喜欢它的人格，用五分钟。","喜不喜欢再说，先把手伸过去。"];
function seedCues(){ if(!S.cues.length){ SEED_CUES.forEach(function(t,i){ S.cues.push({id:"cue"+i,text:t,favorite:false,lastUsedAt:0}); }); } }

/* ============ 数据助手 ============ */
function taskById(id){ for(var i=0;i<S.tasks.length;i++){ if(S.tasks[i].id===id) return S.tasks[i]; } return null; }
function pointById(id){ for(var i=0;i<S.points.length;i++){ if(S.points[i].id===id) return S.points[i]; } return null; }
function cueById(id){ for(var i=0;i<S.cues.length;i++){ if(S.cues[i].id===id) return S.cues[i]; } return null; }
function sessionById(id){ for(var i=0;i<S.sessions.length;i++){ if(S.sessions[i].id===id) return S.sessions[i]; } return null; }
function activeTasks(){ return S.tasks.filter(function(t){ return !t.archived; }); }
function pointsOf(taskId){ return S.points.filter(function(p){ return p.taskId===taskId; }); }
function taskDueCategory(t){
  if(!t.dueDate) return 1;
  return (t.dueDate<=todayKey())?0:2;
}
function dueLabelOf(ds){
  if(!ds) return "";
  var d=new Date(ds+"T12:00:00");
  var today0=new Date(new Date().toDateString()).getTime();
  var days=Math.round((d.getTime()-today0)/86400000);
  if(days<0) return "逾期 "+(-days)+" 天";
  if(days===0) return "今天到期";
  if(days===1) return "明天到期";
  return (d.getMonth()+1)+"月"+d.getDate()+"日";
}
function dueLabel(t){ return dueLabelOf(t.dueDate); }
function pointDueCategory(p){ if(!p.dueDate) return 1; return (p.dueDate<=todayKey())?0:2; }
function nextPendingPoint(){
  var i,j,t,pts,best=null,bestKey=99;
  for(i=0;i<S.tasks.length;i++){
    t=S.tasks[i]; if(t.archived) continue;
    pts=pointsOf(t.id);
    for(j=0;j<pts.length;j++){
      if(!pts[j].done){
        var k=Math.min(taskDueCategory(t), pointDueCategory(pts[j]));
        if(k<bestKey){ bestKey=k; best={point:pts[j], task:t}; }
        break;
      }
    }
  }
  return best;
}
function nextStepSuggestion(cs){
  var pts=pointsOf(cs.taskId), i, p;
  for(i=0;i<pts.length;i++){ p=pts[i]; if(!p.done && p.id!==cs.pointId) return p.title; }
  return "继续把剩余部分做完";
}
function pickCueForTask(task){
  if(task && task.cueId){ var c=cueById(task.cueId); if(c) return c; }
  var best=null, i;
  for(i=0;i<S.cues.length;i++){ var x=S.cues[i]; if(!best || x.lastUsedAt>best.lastUsedAt) best=x; }
  return best || {id:"",text:SEED_CUES[0],favorite:false,lastUsedAt:0};
}
function pickEvidence(){
  if(!S.evidence.length) return null;
  var np=nextPendingPoint();
  var same = np ? S.evidence.filter(function(e){ return e.taskId===np.task.id; }) : [];
  var pool = same.length ? same : S.evidence;
  var idx = Math.floor(Date.now()/86400000) % pool.length;
  var ev = pool[idx];
  return { ev:ev, task:taskById(ev.taskId) };
}

/* ============ 视图 ============ */
var VIEW="today";
var UI_EXPANDED={};
var BRAND={today:"今天",records:"记录",retro:"回顾",settings:"设置"};
function setView(v){
  if(TOUR && TOUR.step===4 && v==="records") tourOnAct(4);
  if(TOUR && TOUR.step===5 && v==="retro") tourOnAct(5);
  VIEW=v; renderAll();
}
function applyTheme(){
  var th=S.settings.theme||"light";
  var dark = th==="dark" || (th==="auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.body.classList.toggle("dark", !!dark);
}
function applyZoom(){ try{ document.body.style.zoom=String(S.settings.fontScale||1); }catch(e){} }
function renderAll(){
  applyTheme();
  applyZoom();
  try{ document.body.setAttribute("data-view", VIEW); }catch(e){}
  if(IS_WIDGET){ renderWidget(); return; }
  renderView();
  renderFocus();
  renderReview();
  var btn=$('[data-act="toggleWidget"]');
  if(btn && IS_DESKTOP){ btn.style.display="inline-flex"; }
  $$("#navTabs button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-view")===VIEW); });
  var bt=$("#brandTitle"); if(bt) bt.textContent=BRAND[VIEW];
}
function renderView(){
  var v=$("#view");
  if(v){ v.style.animation="none"; void v.offsetWidth; v.style.animation=""; }
  if(VIEW==="today") renderToday();
  else if(VIEW==="records") renderRecords();
  else if(VIEW==="retro") renderRetro();
  else renderSettings();
}

/* ---------- 时间线日历 ---------- */
var CAL_YM=null;
var SELECTED_DAY=null;
function countTasksDue(ds){
  var n=0, i;
  for(i=0;i<S.tasks.length;i++){ if(!S.tasks[i].archived && S.tasks[i].dueDate===ds) n++; }
  for(i=0;i<S.points.length;i++){ if(!S.points[i].done && S.points[i].dueDate===ds) n++; }
  return n;
}
function calDotsHtml(n){
  if(n<=0) return "";
  var h='<span class="cal-dots">';
  var m=Math.min(n,3);
  for(var i=0;i<m;i++) h+='<i></i>';
  h+='</span>';
  return h;
}
function calHtml(){
  var now=new Date();
  if(!CAL_YM) CAL_YM={y:now.getFullYear(), m:now.getMonth()};
  var first=new Date(CAL_YM.y, CAL_YM.m, 1);
  var startDow=(first.getDay()+6)%7;
  var daysIn=new Date(CAL_YM.y, CAL_YM.m+1, 0).getDate();
  var html='<div class="card"><div class="h-label">时间线 · 挂在日期下</div>';
  html+='<div class="cal-head"><button class="iconbtn" data-act="calPrev">‹</button>';
  html+='<span class="cal-title">'+CAL_YM.y+' 年 '+(CAL_YM.m+1)+' 月</span>';
  html+='<button class="iconbtn" data-act="calNext">›</button>';
  html+='<span class="grow"></span><button class="btn btn-ghost btn-sm" data-act="calToday">今天</button></div>';
  html+='<div class="cal-grid">';
  ["一","二","三","四","五","六","日"].forEach(function(d){ html+='<div class="cal-dow">'+d+'</div>'; });
  for(var i=0;i<startDow;i++){ html+='<div class="cal-cell empty"></div>'; }
  for(var d=1;d<=daysIn;d++){
    var ds=pad2(CAL_YM.y)+'-'+pad2(CAL_YM.m+1)+'-'+pad2(d);
    html+='<div class="cal-cell'+(ds===todayKey()?" today":"")+((ds===(SELECTED_DAY||todayKey()))?" sel":"")+'" data-day="'+ds+'" data-act="calDrop">';
    html+='<span class="cal-dnum">'+d+'</span>'+calDotsHtml(countTasksDue(ds))+'</div>';
  }
  html+='</div>';
  html+='<div class="cal-legend">橙色圆点 = 那天挂着任务或执行点；<b>点日期</b>看详情。<br>任务卡、执行点卡都能<b>拖到日期上</b>（再拖同一天 = 摘下来）；手机用 📅。</div>';
  var SELD=SELECTED_DAY||todayKey();
  var isSelToday = SELD===todayKey();
  html+='<div class="shelf"><div class="h-label" style="margin-bottom:8px">'+(isSelToday?"今天要做 · 含逾期":"挂在 "+SELD+" 的")+'</div>';
  var shelfItems=[];
  S.tasks.forEach(function(t){
    if(t.archived || !t.dueDate) return;
    if(t.dueDate===SELD || (isSelToday && t.dueDate<todayKey())) shelfItems.push({type:"task", t:t});
  });
  S.points.forEach(function(p){
    if(p.done || !p.dueDate) return;
    if(p.dueDate===SELD || (isSelToday && p.dueDate<todayKey())) shelfItems.push({type:"point", p:p});
  });
  if(!shelfItems.length){
    html+='<div class="tiny">'+(isSelToday?"今天没有挂东西。把任务卡或执行点卡拖到日历上，这里会列出最先要做的。":"这天还没有挂东西。把任务卡或执行点卡拖到这一天，或点卡片上的 📅 设置。")+'</div>';
  } else {
    shelfItems.forEach(function(it){
      if(it.type==="point"){
        var ptask=taskById(it.p.taskId);
        html+='<div class="shelf-item">';
        html+='<span class="t"><span class="tiny" style="display:block;color:var(--ink-3)">'+esc(ptask?ptask.title:"")+'</span>'+esc(it.p.title)+'</span>';
        html+='<span class="due-chip '+((it.p.dueDate<todayKey())?"over":(it.p.dueDate===todayKey()?"today":""))+'">'+dueLabelOf(it.p.dueDate)+'</span>';
        html+='<button class="go" data-act="start" data-id="'+it.p.id+'" title="开始">▶</button>';
        html+='</div>';
      } else {
        var pts=pointsOf(it.t.id).filter(function(p){ return !p.done; });
        var firstP=pts.length?pts[0]:null;
        html+='<div class="shelf-item">';
        html+='<span class="t">'+esc(it.t.title)+'</span><span class="due-chip '+((it.t.dueDate<todayKey())?"over":(it.t.dueDate===todayKey()?"today":""))+'">'+dueLabel(it.t)+'</span>';
        if(firstP) html+='<button class="go" data-act="start" data-id="'+firstP.id+'" title="开始：'+esc(firstP.title)+'">▶</button>';
        html+='</div>';
      }
    });
  }
  html+='</div></div>';
  return html;
}
function setDueDate(kind, id, day){
  if(kind==="point"){
    var p=pointById(id); if(!p) return;
    p.dueDate = (day && p.dueDate===day) ? null : (day||null);
  } else {
    var t=taskById(id); if(!t) return;
    t.dueDate = (day && t.dueDate===day) ? null : (day||null);
  }
  persist(); renderAll();
}
var PICK=null;
function pickTitle(){
  if(!PICK) return "";
  if(PICK.kind==="point"){ var p=pointById(PICK.id); return p?p.title:""; }
  var t=taskById(PICK.id); return t?t.title:"";
}
function pickDueDate(){
  if(!PICK) return null;
  if(PICK.kind==="point"){ var p=pointById(PICK.id); return p?p.dueDate:null; }
  var t=taskById(PICK.id); return t?t.dueDate:null;
}
function openDuePicker(id, kind){

function taskBlockHtml(t){
  var pts=pointsOf(t.id);
  var openPts=pts.filter(function(x){return !x.done;}), donePts=pts.filter(function(x){return x.done;});
  var dl=dueLabel(t);
  var h='<div class="task-block"><div class="task-head drag-handle" draggable="true" data-drag-task="'+t.id+'" title="拖到日历上设截止日期">';
  h+='<div class="tt">'+esc(t.title)+'</div>';
  if(dl) h+='<span class="due-chip '+((t.dueDate<todayKey())?"over":((t.dueDate===todayKey())?"today":""))+'">'+dl+'</span>';
  h+='<button class="iconbtn" title="设截止日期" data-act="pickDue" data-id="'+t.id+'">📅</button>';
  h+='<span class="cnt">'+openPts.length+' 待做</span>';
  h+='<button class="iconbtn" title="加执行点" data-act="newPoint" data-task="'+t.id+'">＋</button>';
  h+='<button class="iconbtn" title="改任务名" data-act="renameTask" data-id="'+t.id+'">✎</button>';
  h+='<button class="iconbtn" title="归档" data-act="archiveTask" data-id="'+t.id+'">▫</button>';
  h+='<button class="iconbtn" title="删除任务及执行点" data-act="delTask" data-id="'+t.id+'">✕</button></div>';
  for(var j=0;j<openPts.length;j++){ h+=pointRowHtml(openPts[j]); }
  if(donePts.length){
    var dOpen=UI_EXPANDED[t.id];
    h+='<button class="btn btn-ghost btn-sm done-toggle" data-act="toggleDoneList" data-id="'+t.id+'">'+(dOpen?"▾":"▸")+' 已完成 '+donePts.length+' 项</button>';
    if(dOpen){ h+='<div class="done-list">'; for(var k=0;k<donePts.length;k++){ h+=pointRowHtml(donePts[k]); } h+='</div>'; }
  }
  h+='</div>';
  return h;
}

  if(tasks.length){
    html+='<div class="divider"></div>';
    html+='<div class="h-label" style="margin-bottom:10px">现在 · 未安排 / 今天到期 / 逾期</div>';

    dateKeys.forEach(function(dk){

    +(p.doneCriteria?'<div class="pm">做到：'+esc(p.doneCriteria)+(p.checkMinutes?' · '+p.checkMinutes+'分钟检查':'')+'</div>':'')
    +'</div>'
    +'<button class="go" title="开始专注" data-act="start" data-id="'+p.id+'">▶</button>'
    +'<div class="pa"><button class="iconbtn" title="安排到某天" data-act="pickPointDue" data-id="'+p.id+'">📅</button>'
    +'<button class="iconbtn" data-act="editPoint" data-id="'+p.id+'">✎</button>'
    +'<button class="iconbtn" data-act="delPoint" data-id="'+p.id+'">✕</button></div></div>';
}

/* ---------- 记录 ---------- */
var REC_FILTER="all";
var REC_TASK="all";
function renderRecords(){
  var html="", i;
  var dr=null;
  for(i=0;i<S.dailyReviews.length;i++){ if(S.dailyReviews[i].date===todayKey()) dr=S.dailyReviews[i]; }
  html+='<div class="dr-card"><div class="h-label">今日反思 · 两个问题，随手写</div>';
  html+='<div class="dq">今天有什么证据说明我向前走了一点？</div>';
  html+='<textarea id="drProgress" class="txa" style="min-height:54px" placeholder="昨天不会，今天能独立做出一道……">'+esc(dr?dr.progress:"")+'</textarea>';
  html+='<div class="dq">还有哪个阻力没有解决？</div>';
  html+='<textarea id="drBlocker" class="txa" style="min-height:54px" placeholder="缺的定理、总想摸手机、第一步还是太大……">'+esc(dr?dr.blocker:"")+'</textarea>';
  html+='<div style="margin-top:12px"><button class="btn btn-ink btn-sm" data-act="saveDailyReview">保存今天的反思</button></div></div>';
  html+='<div class="filters">';
  var names={all:"全部",focus:"专注",journal:"随手记",evidence:"证据"};
  Object.keys(names).forEach(function(f){
    html+='<button class="chip'+(REC_FILTER===f?" on":"")+'" data-act="recFilter" data-f="'+f+'">'+names[f]+'</button>';
  });
  html+='<span class="grow"></span>';
  html+='<select class="sel" style="width:auto" data-act="recTask">';
  html+='<option value="all"'+(REC_TASK==="all"?" selected":"")+'>全部任务</option>';
  for(i=0;i<S.tasks.length;i++){ html+='<option value="'+S.tasks[i].id+'"'+(REC_TASK===S.tasks[i].id?" selected":"")+'>'+esc(S.tasks[i].title)+'</option>'; }
  html+='</select>';
  html+='<button class="btn btn-soft btn-sm" data-act="openJournal">＋ 随手记</button></div>';
  var groups={};
  function push(gk, entry){ if(!groups[gk]) groups[gk]=[]; groups[gk].push(entry); }
  for(i=0;i<S.sessions.length;i++){
    var s=S.sessions[i];
    if(REC_TASK!=="all" && s.taskId!==REC_TASK) continue;
    var ev=null;
    for(var e2=0;e2<S.evidence.length;e2++){ if(S.evidence[e2].sessionId===s.id) ev=S.evidence[e2]; }
    if(REC_FILTER==="evidence" && !ev) continue;
    if(REC_FILTER==="journal") continue;
    push(dayKey(s.endAt), {t:s.endAt, html:sessionEntryHtml(s, ev)});
  }
  if(REC_FILTER!=="focus" && REC_FILTER!=="evidence"){
    for(i=0;i<S.journals.length;i++){
      var j=S.journals[i];
      push(dayKey(j.createdAt), {t:j.createdAt, html:journalEntryHtml(j)});
    }
    for(i=0;i<S.dailyReviews.length;i++){
      var d2=S.dailyReviews[i];

var polObs=null;
function bindPolObserve(){
  if(polObs){ polObs.disconnect(); polObs=null; }
  var pols=$$(".pol");
  if(!("IntersectionObserver" in window)){ pols.forEach(function(p){ p.classList.add("in"); }); return; }
  polObs=new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add("in"); polObs.unobserve(en.target); } });
  }, {threshold:0.1});
  pols.forEach(function(p){ polObs.observe(p); });

var AI_REVIEW_SYSTEM='你是一位温和的复盘伙伴。用户会给你他一整周的真实记录（专注、三问、进步证据、日记、每日复盘）。请用他的原话素材写一段 200 字以内的周回顾，要求：1. 只依据给定材料，不编造任何事；2. 温柔但克制，不喊口号、不灌鸡汤；3. 指出真实发生的进步（哪怕很小），也如实提到反复出现的阻力；4. 用第二人称"你"，像朋友坐在旁边说话；5. 不要输出 JSON，直接输出一段中文文字。';
function aiWeeklyBuild(){
  var now=Date.now(), weekStart=now-7*86400000, lines=[];
  S.sessions.forEach(function(s){
    if(s.status!=="done" || s.endAt<weekStart) return;
    var l="专注 "+fmtTime(s.startAt)+"–"+fmtTime(s.endAt)+" 「"+s.taskTitle+" · "+s.pointTitle+"」";
    if(s.review){
      if(s.review.progressNote) l+="；进展："+s.review.progressNote;
      if(s.review.planValid==="yes") l+="；出现新信息："+(s.review.planNote||"");
      if(s.review.earlyReason) l+="；提前结束原因："+s.review.earlyReason;
    }
    lines.push("- "+l);
  });
  S.evidence.forEach(function(e){ if(e.createdAt>=weekStart) lines.push("- 进步证据："+e.note); });
  S.journals.forEach(function(j){ if(j.createdAt>=weekStart) lines.push("- 随手记（"+fmtDay(j.createdAt)+"）："+j.text); });
  S.dailyReviews.forEach(function(d){ if(d.createdAt>=weekStart) lines.push("- 每日复盘（"+d.date+"）：前进="+(d.progress||"无")+"；阻力="+(d.blocker||"无")); });
  if(!lines.length) return null;
  return "这是我这一周的真实记录：\n"+lines.join("\n");
}
async function aiWeekly(){
  if(!S.settings.apiKey){ toast("先在设置页填 DeepSeek API Key"); return; }
  var u=aiWeeklyBuild();
  if(!u){ toast("这一周还没有记录——先去做一段真实的专注，再回来生成回顾"); return; }
  var box=$("#aiWeeklyBox");

  var r=await callAI([{role:"system",content:AI_REVIEW_SYSTEM},{role:"user",content:u}]);

    if(box) box.innerHTML='<div class="qline" style="border-color:#A8482B;background:#F6E4DC;color:#8A3B20">'+esc(r.error)+'</div><button class="btn btn-soft btn-sm" data-act="aiWeekly">重试</button>';
    return;
  }
  S.aiWeekly={ week:weekKey(), text:String(r.text||"").trim(), createdAt:Date.now() };

}

var audioCtx=null;
function beep(){
  if(!S.settings.sound) return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    var t0=audioCtx.currentTime;
    [[880,0],[1174.66,0.22]].forEach(function(pair){
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sine"; o.frequency.value=pair[0];
      g.gain.setValueAtTime(0.0001,t0+pair[1]);
      g.gain.exponentialRampToValueAtTime(0.16,t0+pair[1]+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+pair[1]+0.55);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0+pair[1]); o.stop(t0+pair[1]+0.6);
    });
  }catch(e){}
}

  try{ if(typeof Notification!=="undefined" && Notification.permission==="granted"){ new Notification(title,{body:body||"",silent:true}); } }catch(e){}
}

function tick(){
  maybeRemind();
  var cs=S.currentSession;
  if(cs && cs.status==="running" && !cs.reviewing){
    var remain=cs.endAt-Date.now();
    var label;
    if(cs.overtime){
      var over=Date.now()-cs.endAt;
      if(over>3*3600000) over=3*3600000;
      label="+"+fmtClock(over);
    } else {
      label=fmtClock(remain);
    }
    var t1=$("#focusTimer"); if(t1){ t1.textContent=label; t1.classList.toggle("over", !!cs.overtime); }
    var t2=$("#wTimer"); if(t2){ t2.textContent=label; t2.classList.toggle("over", !!cs.overtime); }
    if(remain<=0 && !timedOutFired){ timedOutFired=true; enterOvertime(); }
  }
}

/* ============ 结束三问 ============ */
function reviewFormHtml(compact){
  var cs=S.currentSession; if(!cs) return "";
  var pend=pointsOf(cs.taskId).filter(function(p){ return !p.done && p.id!==cs.pointId; });
  var plannedMs=cs.endAt-cs.startAt;
  var elapsedMs=(cs.actualEnd||cs.endAt)-cs.startAt;
  var early = plannedMs-elapsedMs > plannedMs*0.5;
  var last = early ? 4 : 3;
  var h='<div class="'+(compact?"wreview":"")+'">';
  h+='<div class="rw-dots">';
  for(var di=1;di<=last;di++){ h+='<span class="rw-dot'+(di===1?" on":"")+'" data-dot="'+di+'"></span>'; }
  h+='</div>';
  h+='<div class="rw-err"></div>';
  h+='<div class="rw-step on" data-step="1">';
  h+='<div class="qblock"><div class="qn"><span class="n">1</span>有没有出现使原计划失效的新信息？</div>';
  h+='<div class="chiprow"><label class="chip"><input type="radio" name="planValid" value="no" checked><span>没有新信息</span></label>';
  h+='<label class="chip"><input type="radio" name="planValid" value="yes"><span>有新信息</span></label></div>';
  h+='<textarea class="txa" name="planNote" style="min-height:56px" placeholder="有新信息才写：什么信息？一句就够"></textarea>';
  h+='<div class="rw-nav"><button class="btn btn-primary btn-sm" data-act="rwNext">下一问 →</button></div></div></div>';
  h+='<div class="rw-step" data-step="2">';
  h+='<div class="qblock"><div class="qn"><span class="n">2</span>这一段，真实发生了什么？</div>';
  h+='<div class="chiprow"><label class="chip"><input type="radio" name="progress" value="advanced" checked><span>有推进</span></label>';
  h+='<label class="chip"><input type="radio" name="progress" value="stuck"><span>卡住了</span></label>';
  h+='<label class="chip"><input type="radio" name="progress" value="both"><span>都有一些</span></label></div>';
  h+='<textarea class="txa" name="progressNote" style="min-height:56px" placeholder="一句话说说，比如：独立做出一类题 / 卡在某个定理（可留空）"></textarea>';
  h+='<div class="tiny" style="margin:0 0 8px">选一个就行，写不写都能「下一问」。</div>';
  h+='<div class="rw-nav"><button class="btn btn-ghost btn-sm" data-act="rwPrev">← 上一问</button><button class="btn btn-primary btn-sm" data-act="rwNext">下一问 →</button></div></div></div>';
  if(early){
    h+='<div class="rw-step" data-step="3">';
    h+='<div class="qblock"><div class="qn"><span class="n">3</span>为什么提前结束这一段？</div>';
    h+='<div class="chiprow"><label class="chip"><input type="radio" name="earlyReason" value="done_early" checked><span>已经做完了</span></label>';
    h+='<label class="chip"><input type="radio" name="earlyReason" value="distracted"><span>分心，想去做别的</span></label>';
    h+='<label class="chip"><input type="radio" name="earlyReason" value="tired"><span>状态太差做不动</span></label>';
    h+='<label class="chip"><input type="radio" name="earlyReason" value="interrupted"><span>有其他事插进来</span></label></div>';
    h+='<textarea class="txa" name="earlyNote" style="min-height:44px" placeholder="可留空"></textarea>';
    h+='<div class="rw-nav"><button class="btn btn-ghost btn-sm" data-act="rwPrev">← 上一问</button><button class="btn btn-primary btn-sm" data-act="rwNext">下一问 →</button></div></div></div>';
  }
  h+='<div class="rw-step" data-step="'+last+'">';
  h+='<div class="qblock"><div class="qn"><span class="n">'+last+'</span>下一个执行点做什么？</div>';
  h+='<select class="sel" name="nextChoice" data-act="rwNextChoice">';
  h+='<option value="" selected>先不考虑了</option>';
  h+='<option value="__custom">手动写一个…</option>';
  pend.forEach(function(p){ h+='<option value="existing:'+p.id+'">'+esc(p.title)+'</option>'; });
  h+='</select>';
  h+='<input class="inp" name="nextStep" style="display:none;margin-top:8px" placeholder="下一个执行点做什么？">';
  h+='<div class="hint" style="font-size:11.5px;color:var(--ink-3);margin-top:4px">从现有执行点里挑，或先不安排。</div></div>';
  h+='<label class="chip" style="margin-bottom:14px"><input type="checkbox" id="evCheck"><span>✦ 把这次存为进步证据</span></label>';
  h+='<div class="rw-nav"><button class="btn btn-ghost btn-sm" data-act="rwPrev">← 上一问</button><button class="btn btn-primary" data-act="submitReview" data-which="'+(compact?"widget":"main")+'">保存这次专注</button></div></div>';
  h+='</div>';
  return h;
}
function rwStepOf(root){ var on=root.querySelector(".rw-step.on"); return on?parseInt(on.getAttribute("data-step"),10):1; }
function rwShow(root, n){
  var steps=root.querySelectorAll(".rw-step");
  for(var i=0;i<steps.length;i++){
    var on=parseInt(steps[i].getAttribute("data-step"),10)===n;
    steps[i].classList.toggle("on", on);
    steps[i].style.display=on?"block":"none";
  }
  var dots=root.querySelectorAll(".rw-dot");
  for(var j=0;j<dots.length;j++){ dots[j].classList.toggle("on", parseInt(dots[j].getAttribute("data-dot"),10)===n); }
  var er=root.querySelector(".rw-err"); if(er){ er.style.display="none"; }
}
function rwErr(root, msg){
  var er=root.querySelector(".rw-err");
  if(er){ er.textContent=msg; er.style.display="block"; }
}
function rwNext(){
  var root = IS_WIDGET ? $("#widgetBody") : $("#reviewRoot");
  if(!root) return;
  var n=rwStepOf(root);
  if(n===1){
    var r=root.querySelector("input[name=planValid]:checked");
    var note=root.querySelector("textarea[name=planNote]");
    if(r && r.value==="yes" && !(note&&note.value.trim())){ rwErr(root,"你选了「有新信息」——顺手记一句是什么信息，火警要直通负责人。"); return; }
  }
  rwShow(root, n+1);
}
function rwPrev(){
  var root = IS_WIDGET ? $("#widgetBody") : $("#reviewRoot");
  if(!root) return;
  var n=rwStepOf(root);
  if(n>1) rwShow(root, n-1);
}
function renderReview(){
  var cs=S.currentSession;
  if(!cs || !cs.reviewing || (cs.endIn||cs.startedIn||"main")!=="main"){
    var m=$("#modal");
    if(m && m.getAttribute("data-review")==="1") closeModal();
    return;
  }
  var body='<div id="reviewRoot">'+reviewFormHtml(false)+'</div>';
  var foot='<span class="left">一次只问一个——把完整的脑子接回来。</span>';
  foot+='<button class="btn btn-ghost" data-act="cancelReview">回到专注</button>';
  foot+='<button class="btn btn-ghost" style="color:#A8482B" data-act="abandonSession">放弃这一段</button>';
  var m=$("#modal");
  m.setAttribute("data-review","1");
  m.innerHTML='<div class="modal-card"><div class="modal-head"><div><div class="mt">结束三问</div><div class="ms">「'+esc(cs.pointTitle)+'」· '+fmtClock(Math.max(0,(cs.actualEnd||cs.endAt)-cs.startAt))+'</div></div></div>'
    +'<div class="modal-body">'+body+'</div><div class="modal-foot">'+foot+'</div></div>';
  m.classList.add("show");
  m.onclick=null;
  if(IS_DESKTOP){
    window.desktopAPI.widgetVisible().then(function(v){
      if(v){ _widgetWasVisible=true; window.desktopAPI.toggleWidget(false); }
    }).catch(function(){});
  }
}
function cancelReview(){ var cs=S.currentSession; if(!cs) return; cs.reviewing=false; persist(); renderAll(); }
function abandonSession(){
  var cs=S.currentSession; if(!cs) return;
  if(!confirm("放弃这一段？它不会被记为完成，也不会被记成失败——只是退回正常状态，晚点复盘再想。")) return;
  cs.status="abandoned"; cs.actualEnd=Date.now();
  S.sessions.push(cs); S.currentSession=null;
  closeModal(); persist(); renderAll();
  toast("已退出。晚点复盘时再想它。");
}
function submitReviewFrom(which){
  var root = which==="widget" ? $("#widgetBody") : $("#reviewRoot");
  if(!root) return;
  var cs=S.currentSession; if(!cs) return;
  function val(sel){ var el=root.querySelector(sel); return el?el.value:""; }
  function rad(name){ var el=root.querySelector("input[name="+name+"]:checked"); return el?el.value:""; }
  var planValid=rad("planValid")||"no";
  var planNote=val("textarea[name=planNote]").trim();
  var progress=rad("progress")||"advanced";
  var progressNote=val("textarea[name=progressNote]").trim();
  var nextChoice=val("select[name=nextChoice]");
  var nextStep="";
  var createNext=false;
  if(nextChoice==="__custom"){
    nextStep=val("input[name=nextStep]").trim();
    if(nextStep) createNext=true;
  } else if(nextChoice && nextChoice.indexOf("existing:")===0){
    var npp=pointById(nextChoice.slice(9));
    if(npp) nextStep=npp.title;
  }
  var evEl=root.querySelector("input[id=evCheck]");
  var wantEv = !!(evEl && evEl.checked);
  var erEl=root.querySelector("input[name=earlyReason]:checked");
  var earlyReason=erEl?erEl.value:"";
  var earlyNote=val("textarea[name=earlyNote]").trim();
  if(planValid==="yes" && !planNote){ toast("有新信息就顺手记一句——火警要直通负责人"); return; }
  if(!progressNote){ progressNote={advanced:"有推进",stuck:"卡住了",both:"有推进，也有卡住"}[progress]||"有推进"; }
  cs.review={ planValid:planValid, planNote:planNote, progress:progress, progressNote:progressNote, nextStep:nextStep,
    earlyReason:earlyReason, earlyNote:earlyNote };
  cs.status="done";
  cs.endAt=cs.actualEnd||cs.endAt;
  S.sessions.push(cs);
  var p=pointById(cs.pointId); if(p) p.done=true;
  if(createNext && nextStep){ S.points.push({ id:uid(), taskId:cs.taskId, title:nextStep, doneCriteria:"", done:false, checkMinutes:null, createdAt:Date.now(), fromSession:cs.id }); }
  if(cs.cueId){ var c=cueById(cs.cueId); if(c) c.lastUsedAt=Date.now(); var t=taskById(cs.taskId); if(t) t.cueId=cs.cueId; }
  if(wantEv){
    var note=progressNote || "这一次有点进展。";
    S.evidence.push({ id:uid(), sessionId:cs.id, taskId:cs.taskId, createdAt:Date.now(), note:note });
  }
  S.currentSession=null;
  persist(); renderAll();
  if(which==="main") closeModal();
  tourResume();
  toast(wantEv ? "已保存，并存为进步证据 ✦" : "已保存。记录会自动留下，不用再写一遍。");
}

/* ============ 记录操作 ============ */
function saveDailyReview(){
  var a=$("#drProgress"), b=$("#drBlocker");
  if(!a || !b) return;
  if(!a.value.trim() && !b.value.trim()){ toast("两问都空着就先不记"); return; }
  var ex=null, i;
  for(i=0;i<S.dailyReviews.length;i++){ if(S.dailyReviews[i].date===todayKey()) ex=S.dailyReviews[i]; }
  if(ex){ ex.progress=a.value.trim(); ex.blocker=b.value.trim(); }
  else S.dailyReviews.push({ id:uid(), date:todayKey(), progress:a.value.trim(), blocker:b.value.trim(), createdAt:Date.now() });
  persist(); renderAll(); toast("记下了。");
}
function toggleEvidence(sessionId){
  var idx=-1, i;
  for(i=0;i<S.evidence.length;i++){ if(S.evidence[i].sessionId===sessionId) idx=i; }
  if(idx>=0){ S.evidence.splice(idx,1); persist(); renderAll(); toast("已取消证据标记"); return; }
  var sess=sessionById(sessionId); if(!sess) return;
  var def=(sess.review&&sess.review.progressNote)?sess.review.progressNote:"";
  openModal("存为进步证据", "只有你自己确认过的真实记录，才会出现在「过去的你」里。",
    '<div class="field"><label>这句证据</label><textarea id="evNote" class="txa">'+esc(def)+'</textarea></div>',
    '<button class="btn btn-primary" data-act="saveEvidence" data-id="'+sessionId+'">存下 ✦</button>', {loose:true});
}
function saveEvidence(sessionId){
  var el=$("#evNote"); var note=(el?el.value:"").trim()||"这一次有点进展。";
  var sess=sessionById(sessionId);
  S.evidence.push({ id:uid(), sessionId:sessionId, taskId:sess?sess.taskId:null, createdAt:Date.now(), note:note });
  closeModal(); persist(); renderAll(); toast("已存为进步证据 ✦ 未来的你会看到。");
}
var UI_NOTE_TAG=null;
function noteModalFields(preText, preTag){
  UI_NOTE_TAG=preTag||null;
  var h='<div class="field"><label>随手记（想说什么都行）</label>';
  h+='<textarea id="journalText" class="txa" style="min-height:110px" placeholder="今天有什么真的往前走了？卡在哪了？想到什么写什么……">'+esc(preText||"")+'</textarea></div>';
  h+='<div class="field"><label>贴个小标签（可选）</label><div class="chiprow" id="noteTags">';
  [["progress","进步"],["stuck","卡住"],["reflect","反思"]].forEach(function(pair){
    h+='<button class="chip'+(UI_NOTE_TAG===pair[0]?" on":"")+'" data-act="noteTag" data-tag="'+pair[0]+'">'+pair[1]+'</button>';
  });
  h+='</div><div class="hint">标签只是给你自己看的记号，什么都不选也没关系。</div></div>';
  return h;
}
function openNoteModal(){
  openModal("随手记", "不分类、不排版——想到什么写什么。",
    noteModalFields("", null),
    '<button class="btn btn-primary" data-act="saveJournal">记下</button>', {loose:true});
}
function saveJournal(){
  var el=$("#journalText"); if(!el || !el.value.trim()){ closeModal(); return; }
  S.journals.push({ id:uid(), createdAt:Date.now(), text:el.value.trim(), tag:UI_NOTE_TAG });
  closeModal(); persist(); renderAll(); toast("记下了。");
}
function deleteSession(id){
  if(!confirm("删除这条专注记录？")) return;
  S.sessions=S.sessions.filter(function(s){ return s.id!==id; });
  S.evidence=S.evidence.filter(function(e){ return e.sessionId!==id; });
  persist(); renderAll();
}
function openJournalEdit(id){
  var j=null, i;
  for(i=0;i<S.journals.length;i++){ if(S.journals[i].id===id) j=S.journals[i]; }
  if(!j) return;
  openModal("编辑随手记", "",
    noteModalFields(j.text, j.tag||null),
    '<button class="btn btn-primary" data-act="saveJournalEdit" data-id="'+id+'">保存修改</button>', {loose:true});
}
function saveJournalEdit(id){
  var el=$("#journalText"); if(!el) return;
  var j=null, i;
  for(i=0;i<S.journals.length;i++){ if(S.journals[i].id===id) j=S.journals[i]; }
  if(!el.value.trim()){ closeModal(); return; }
  if(j){ j.text=el.value.trim(); j.tag=UI_NOTE_TAG; j.editedAt=Date.now(); }
  closeModal(); persist(); renderAll(); toast("已更新。");
}
function deleteJournal(id){
  if(!confirm("删除这条随手记？")) return;
  S.journals=S.journals.filter(function(j){ return j.id!==id; });
  persist(); renderAll();
}
function openFocusNoteEdit(id){
  var s=sessionById(id); if(!s) return;
  var cur=(s.review&&s.review.progressNote)?s.review.progressNote:"";
  openModal("改这行进展", "这是你当时写下的话，想改就改。",
    '<textarea id="focusNoteText" class="txa" style="min-height:80px">'+esc(cur)+'</textarea>',
    '<button class="btn btn-primary" data-act="saveFocusNote" data-id="'+id+'">保存</button>', {loose:true});
}
function saveFocusNote(id){
  var s=sessionById(id); var el=$("#focusNoteText");
  if(!s || !el){ closeModal(); return; }
  if(!s.review) s.review={};
  s.review.progressNote=el.value.trim();
  closeModal(); persist(); renderAll(); toast("已改。");
}

/* ============ 执行点与任务 ============ */
function openPointModal(pointId, presetTaskId){
  tourOnAct(2);
  var p=pointId?pointById(pointId):null;
  var opts='<option value="">（选一个阶段任务，或新建）</option>', i;
  var tasks=activeTasks();
  for(i=0;i<tasks.length;i++){ var sel=(p?p.taskId===tasks[i].id:(presetTaskId===tasks[i].id));
    opts+='<option value="'+tasks[i].id+'"'+(sel?" selected":"")+'>'+esc(tasks[i].title)+'</option>'; }
  opts+='<option value="__new">＋ 新建阶段任务</option>';
  var cueOpts="", j;
  for(j=0;j<S.cues.length;j++){ var c=S.cues[j];
    cueOpts+='<option value="'+c.id+'"'+((p&&p.cueId===c.id)?" selected":"")+'>'+esc(c.text)+'</option>'; }
  var body='<div class="field"><label>属于哪个阶段任务</label><select id="pmTask" class="sel" data-act="pmTask">'+opts+'</select>';
  body+='<input id="pmNewTask" class="inp" style="margin-top:8px;display:none" placeholder="新任务名：最近在推进什么？"></div>';
  body+='<div class="field"><label>现在做什么？（动作，不是目标）</label>';
  body+='<input id="pmTitle" class="inp" placeholder="例：打开数学53第42页，做到45页" value="'+esc(p?p.title:"")+'">';
  body+='<div class="hint">写成手能直接伸向的动作——「复习数学」不是动作，「打开第42页」才是。</div></div>';
  body+='<div class="field"><label>做到哪里算这一段结束？</label>';
  body+='<input id="pmCriteria" class="inp" placeholder="例：做完45页并订正" value="'+esc(p?p.doneCriteria:"")+'"></div>';
  body+='<div class="field"><label>最晚多久后检查？</label>';
  body+='<select id="pmMins" class="sel">';
  [15,25,30,45,60].forEach(function(m){ body+='<option value="'+m+'"'+((p?p.checkMinutes:S.settings.defaultMinutes)===m?" selected":"")+'>'+m+' 分钟</option>'; });
  body+='</select></div>';
  body+='<div class="field"><label>这次用的提示语（可选）</label>';
  body+='<select id="pmCue" class="sel"><option value="">（沿用该任务上次那句）</option>'+cueOpts+'</select>';
  body+='<input id="pmCueText" class="inp" style="margin-top:8px" placeholder="或临时写一句……" value="'+esc(p&&p.cueText?p.cueText:"")+'"></div>';
  var foot='<span class="left">规划到能直接行动就停。</span>';
  foot+='<button class="btn btn-primary" data-act="savePoint" data-id="'+(p?p.id:"")+'">保存执行点</button>';
  openModal(p?"编辑执行点":"写一个执行点", "只问三件事：做什么、做到哪、多久检查。", body, foot, {loose:true});
}
function pmTaskChange(){
  var sel=$("#pmTask"), ni=$("#pmNewTask");
  if(sel && ni) ni.style.display=(sel.value==="__new")?"block":"none";
}
function savePointModal(pointId){
  var taskSel=$("#pmTask"), title=$("#pmTitle"), crit=$("#pmCriteria"), mins=$("#pmMins"), cueSel=$("#pmCue"), cueText=$("#pmCueText");
  if(!title || !title.value.trim()){ toast("至少写下现在做什么"); return; }
  var taskId=taskSel?taskSel.value:"", t;
  if(taskId==="__new" || !taskId){
    var nt=$("#pmNewTask");
    var tname=(nt&&nt.value.trim())?nt.value.trim():"未命名任务";
    t={ id:uid(), title:tname, archived:false, createdAt:Date.now() };
    S.tasks.push(t); taskId=t.id;
  }
  var cueId=cueSel&&cueSel.value?cueSel.value:null;
  var cText=(cueText&&cueText.value.trim())?cueText.value.trim():null;
  if(cText){ var nc={ id:uid(), text:cText, favorite:false, lastUsedAt:0 }; S.cues.push(nc); cueId=nc.id; }
  if(pointId){
    var p=pointById(pointId); if(!p){ closeModal(); return; }
    p.taskId=taskId; p.title=title.value.trim(); p.doneCriteria=crit?crit.value.trim():""; p.checkMinutes=mins?parseInt(mins.value,10)||null:null;
    if(cueId) p.cueId=cueId;
  } else {
    S.points.push({ id:uid(), taskId:taskId, title:title.value.trim(), doneCriteria:crit?crit.value.trim():"", done:false,
      checkMinutes:mins?parseInt(mins.value,10)||null:null, createdAt:Date.now(), cueId:cueId||null });
  }
  var t2=taskById(taskId); if(t2 && cueId) t2.cueId=cueId;
  closeModal(); persist(); renderAll();
}
function openTaskModal(){
  openModal("新建阶段任务", "任务清单描述目标，执行清单提供动作入口。这里只写目标。",
    '<div class="field"><label>最近在推进什么？</label><input id="tmTitle" class="inp" placeholder="例：准备组会汇报"></div>',
    '<button class="btn btn-primary" data-act="saveTask">创建</button>', {loose:true});
}

}

/* ============ 设置操作 ============ */
function saveApiKey(){
  var el=$("#setApiKey"); if(!el) return;
  S.settings.apiKey=el.value.trim();
  persist(); renderAll(); toast(S.settings.apiKey?"Key 已保存（只在本机）":"已清空 Key");
}
function setDefaultMinutes(v){ S.settings.defaultMinutes=parseInt(v,10)||25; persist(); }
function setToggle(key, val){ S.settings[key]=!!val; persist(); }
function setWidgetOpacity(v){ S.settings.widgetOpacity=parseFloat(v); persist(); }
function toggleCueFav(id){ var c=cueById(id); if(!c) return; c.favorite=!c.favorite; persist(); renderAll(); }
function deleteCue(id){
  if(S.cues.length<=1){ toast("至少留一句"); return; }
  if(!confirm("删除这句提示语？")) return;
  S.cues=S.cues.filter(function(c){ return c.id!==id; });
  persist(); renderAll();
}
function addCue(){
  var el=$("#newCue"); if(!el || !el.value.trim()) return;
  S.cues.push({ id:uid(), text:el.value.trim(), favorite:false, lastUsedAt:0 });
  persist(); renderAll();
}
async function openBackups(){
  if(IS_DESKTOP){
    var list=await window.desktopAPI.backupList();
    var body="";
    if(!list || !list.length){ body='<div class="muted">还没有备份。完成一次操作后，应用会自动开始留备份。</div>'; }
    else {
      body='<div class="tiny" style="margin-bottom:10px">按时间倒序。恢复会替换当前全部数据，恢复前当前的也会先备份。</div>';
      list.forEach(function(b){
        body+='<div class="set-row"><div class="sl" style="font-size:13px">'+fmtDay(b.mtime)+' '+fmtTime(b.mtime)+'</div>'
          +'<button class="btn btn-soft btn-sm" data-act="restoreBackup" data-name="'+esc(b.name)+'">恢复</button></div>';
      });
    }
    openModal("从备份恢复","",body,"",{loose:true});
  } else {
    var prev=null; try{ prev=localStorage.getItem("jiangzhi.backup"); }catch(e){}
    var body= prev
      ? '<div class="set-row"><div class="sl" style="font-size:13px">上一次改动前的快照</div><button class="btn btn-soft btn-sm" data-act="restoreBackup" data-name="__local">恢复</button></div>'
      : '<div class="muted">浏览器版只保留「上一次改动前」的一份快照，目前还没有。</div>';
    openModal("从备份恢复","",body,"",{loose:true});
  }
}
async function restoreBackup(name){
  if(IS_DESKTOP){
    var r=await window.desktopAPI.backupRestore(name);
    if(r.ok){ closeModal(); renderAll(); toast("已从备份恢复。"); }
    else toast("恢复失败："+r.error);
  } else {
    try{
      var prev=localStorage.getItem("jiangzhi.backup");
      if(prev){ S=normalize(JSON.parse(prev)); seedCues(); persist(); closeModal(); renderAll(); toast("已恢复上次改动前的数据。"); }
    }catch(e){ toast("恢复失败：快照不可用"); }
  }
}
async function exportData(){
  if(IS_DESKTOP){
    var r=await window.desktopAPI.exportData();
    if(r.ok) toast("已导出到："+r.filePath);
  } else {
    var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="jiangzhi-export-"+todayKey()+".json";
    a.click(); URL.revokeObjectURL(a.href);
    toast("已导出");
  }
}
async function importData(){
  if(IS_DESKTOP){
    var r=await window.desktopAPI.importData();
    if(r.ok && r.data){ S=normalize(r.data); seedCues(); persist(); renderAll(); toast("导入完成"); }
  } else {
    var fi=document.createElement("input");
    fi.type="file"; fi.accept=".json,application/json";
    fi.onchange=function(){
      var f=fi.files[0]; if(!f) return;
      var rd=new FileReader();
      rd.onload=function(){
        try{ S=normalize(JSON.parse(rd.result)); seedCues(); persist(); renderAll(); toast("导入完成"); }
        catch(e){ toast("导入失败：不是有效的数据文件"); }
      };
      rd.readAsText(f);
    };
    fi.click();
  }
}
function clearData(){
  if(!confirm("清空全部数据？此操作不可恢复。")) return;
  S=defaultStore(); seedCues(); persist(); renderAll(); toast("已清空");
}

/* ============ AI：想法 → 执行清单 ============ */
var AI_SYSTEM='你是「主动降智」方法里的规划助手。用户给你一句想法或一段材料，你把它转成一份马上能做的执行清单。硬性规则：1. 只输出一个 JSON 对象，结构：{"tasks":[{"title":"阶段任务名","setup_hint":"一句环境预设建议（可为空字符串）","points":[{"action":"可直接动手的具体动作","done_criteria":"做到哪里算这一段结束","check_minutes":25}]}],"changes":[{"type":"add_points","task_title":"已有任务名","points":[{"action":"...","done_criteria":"...","check_minutes":25}]},{"type":"delete_point","task_title":"已有任务名","point_title":"已有执行点标题"}],"questions":[{"ask":"需要补充的问题","options":["选项A","选项B"]}]}。changes 可为空数组。2. 执行点必须跨过「可直接行动」阈值：写成手能直接伸向的动作（打开什么文件、读哪一段、写出哪一句），而不是「复习数学」这种目标。3. 禁止输出标签、优先级、截止时间、任务意义、鼓励语、鸡汤。4. 不编造用户没提供的事实（页数、章节、人名、数据）。缺信息就写成 questions，最多 3 个，每个带 2-4 个短选项；信息够则 questions 为空数组。5. 每个任务最多 5 个执行点，现在就能开始、最重要的排最前。6. check_minutes 只取 15、25、30 中最合适的。7. 全部用中文。8. 如果用户附上了现有清单：默认不重复生成其中已存在的执行点；当新动作明显属于某个已有任务时，用 changes 里的 add_points 挂到该任务下，task_title 必须与已有任务名完全一致；只有当某个已有执行点与新计划明显重复或已过时时，才用 changes 里的 delete_point 建议删除（最多 2 条，必须谨慎）；其余新内容一律放进 tasks。9. delete_point 只是建议，用户会逐条审核，未经批准不生效。';

var AIUI={ mode:"tongyong", draft:null, questions:[], answers:{}, genCount:0, includeTasks:{}, changes:[], delApprove:{} };
function openAI(){
  AIUI={ mode:"tongyong", draft:null, questions:[], answers:{}, genCount:0, includeTasks:{}, changes:[], delApprove:{} };
  openModal("把想法交给它", "AI 只负责起草，确认权在你——规划到能直接行动就停。", aiBodyHtml(), aiFootHtml(), {loose:false, wide:true});
  aiRenderMode();

  for(m in TEMPLATES){ h+='<button class="ai-tab" data-act="aiMode" data-m="'+m+'">'+TEMPLATES[m].name+'</button>'; }
  h+='</div>';
  h+='<div id="aiCtx"></div>';
  h+='<div id="aiInput"></div>';
  h+='<div id="aiOutput"></div>';
  return h;
}
function aiFootHtml(){
  return '<span class="left" id="aiFootNote"></span>'
    +'<button class="btn btn-soft" data-act="aiRegen" style="display:none">重新生成</button>'
    +'<button class="btn btn-soft" data-act="aiSave" style="display:none">只保存清单</button>'
    +'<button class="btn btn-primary" data-act="aiGo">生成执行清单 →</button>';
}
function aiSetMode(m){
  AIUI.mode=m; AIUI.draft=null; AIUI.questions=[]; AIUI.answers={}; AIUI.genCount=0;
  $$(".ai-tab").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-m")===m); });
  aiRenderMode();
}
function aiRenderMode(){
  var box=$("#aiInput"); if(!box) return;
  box.style.animation="none"; void box.offsetWidth; box.style.animation="";
  aiRenderCtx();
  var t=TEMPLATES[AIUI.mode]||TEMPLATES.tongyong;
  var h="", i, f;
  if(AIUI.mode==="tongyong"){
    h='<div class="field"><label>想法（可以很乱，不必完整）</label>';
    h+='<textarea id="aiIdea" class="txa" style="min-height:96px" placeholder="例：下周三组会要汇报进展，我还没开始整理，头大，PPT 也不知道讲啥……"></textarea></div>';
  } else {
    h='<div class="field"><label>先给它一点起点（填你有的，其余它会问）</label></div>';
    for(i=0;i<t.fields.length;i++){
      f=t.fields[i];
      h+='<div class="field"><label>'+f.label+'</label>';
      if(f.type==="text"){ h+='<input class="inp" id="aif_'+f.key+'" placeholder="'+esc(f.ph||"")+'">'; }
      else {
        h+='<div class="chiprow">';
        f.options.forEach(function(o){
          h+='<button class="chip aichip" data-act="aiChip" data-k="'+f.key+'" data-v="'+esc(o)+'">'+esc(o)+'</button>';
        });
        h+='</div>';
      }
      h+='</div>';
    }
  }
  box.innerHTML=h;
  $$(".aichip").forEach(function(ch){ var k=ch.getAttribute("data-k"), v=ch.getAttribute("data-v");
    if(AIUI.answers[k]===v) ch.classList.add("on"); });
  aiSyncButtons();
}
function aiChipPick(k, v){
  if(AIUI.answers[k]===v){ delete AIUI.answers[k]; }
  else AIUI.answers[k]=v;
  $$(".aichip").forEach(function(c){ c.classList.remove("on"); });
  if(AIUI.answers[k]) $$('.aichip[data-k="'+k+'"][data-v="'+AIUI.answers[k]+'"]').forEach(function(c){ c.classList.add("on"); });
}
function aiCollectInputs(){
  var g={text:"", lines:[]};
  if(AIUI.mode==="tongyong"){
    var el=$("#aiIdea");
    g.text=(el?el.value:"").trim();
    return g;
  }
  var t=TEMPLATES[AIUI.mode], i, f;
  for(i=0;i<t.fields.length;i++){
    f=t.fields[i];
    var v=AIUI.answers[f.key]||"";
    if(f.type==="text"){ var inp=$("#aif_"+f.key); v=(inp?inp.value:"").trim(); }
    if(v && v!=="跳过") g.lines.push(f.label+"："+v);
  }
  return g;
}
function aiRenderCtx(){
  var box=$("#aiCtx"); if(!box) return;
  var tasks=activeTasks(); if(!tasks.length){ box.innerHTML=""; return; }
  var h='<div class="field" style="margin-bottom:8px"><label>附上现有清单（让 AI 看见你已有的任务和执行点，避免重复）</label><div class="chiprow">';
  tasks.forEach(function(t){
    var on=(AIUI.includeTasks[t.id]!==false)?" on":"";
    h+='<button class="chip'+on+'" data-act="aiCtxToggle" data-id="'+t.id+'">'+esc(t.title)+'</button>';
  });
  h+='</div></div>';
  box.innerHTML=h;
}
function aiBuildCtx(){
  var tasks=activeTasks(); if(!tasks.length) return "";
  var sel=tasks.filter(function(t){ return AIUI.includeTasks[t.id]!==false; });
  if(!sel.length) return "";
  var lines=sel.map(function(t){
    var pts=pointsOf(t.id).map(function(p){ return (p.done?"已做 ":"待做 ")+p.title; });
    return "- 任务「"+t.title+"」"+(pts.length?("："+pts.join("；")):"（暂无执行点）");
  });
  return "我现有的清单（这些已经存在，不要重复生成，除非我在想法里明确要求续拆或调整）：\n"+lines.join("\n");
}
function aiBuildUserContent(extra){
  var g=aiCollectInputs();
  var out="";
  if(AIUI.mode==="tongyong"){
    if(!g.text){ toast("先说一句你的想法"); return null; }
    out="我的想法（可能很乱）：\n"+g.text;
  } else {
    out="场景："+TEMPLATES[AIUI.mode].name+"。\n用户提供的信息：\n"+(g.lines.length?"- "+g.lines.join("\n- "):"（用户几乎没填，请把关键缺口放进 questions）");
  }
  var ctx=aiBuildCtx();
  if(ctx) out+="\n\n"+ctx;
  if(extra) out+="\n\n用户对问题的补充回答：\n"+extra;
  out+="\n\n请拆成执行清单。";
  return out;
}
async function aiGenerate(){
  if(!S.settings.apiKey){
    var nk=$("#aiOutput");
    if(nk) nk.innerHTML='<div class="qline" style="border-color:#A8482B;background:#F6E4DC;color:#8A3B20">还没有配置 DeepSeek API Key。每人用自己的 Key，只存本机。</div><div style="text-align:right"><button class="btn btn-soft btn-sm" data-act="aiToSettings">去设置页粘贴 Key</button></div>';
    return;
  }
  var u=aiBuildUserContent(null); if(!u) return;
  var box=$("#aiOutput");
  box.innerHTML='<div class="ai-loading"><span class="spin"></span>它在拆你的想法——只拆到「能直接动手」为止。</div>';
  aiSyncButtons(true);
  var r=await callAI([{role:"system",content:AI_SYSTEM},{role:"user",content:u}]);
  if(!r.ok){
    box.innerHTML='<div class="qline" style="border-color:#A8482B;background:#F6E4DC;color:#8A3B20">'+esc(r.error)+'</div>';
    aiSyncButtons(); return;
  }
  var draft=parseAIDraft(r.text);
  if(!draft){
    box.innerHTML='<div class="qline" style="border-color:#A8482B;background:#F6E4DC;color:#8A3B20">模型输出解析失败，点「生成执行清单」再试一次。</div>';
    aiSyncButtons(); return;
  }
  AIUI.draft=draft.tasks; AIUI.questions=draft.questions||[]; AIUI.changes=draft.changes||[]; AIUI.delApprove={}; AIUI.genCount=1;
  aiRenderDraft();
}
async function callAI(messages){
  if(IS_DESKTOP){ return await window.desktopAPI.aiGenerate({ apiKey:S.settings.apiKey, messages:messages }); }
  try{
    var res=await fetch("https://api.deepseek.com/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.settings.apiKey},
      body:JSON.stringify({model:"deepseek-chat",messages:messages,temperature:0.4,response_format:{type:"json_object"}})
    });
    var text=await res.text();
    if(!res.ok) return { ok:false, error:"HTTP "+res.status+" "+text.slice(0,180) };
    var data=JSON.parse(text);
    return { ok:true, text:data.choices[0].message.content };
  }catch(e){
    return { ok:false, error:"浏览器直连失败（可能被跨域限制）："+String(e&&e.message||e)+"。请改用桌面版。" };
  }
}
function parseAIDraft(text){
  try{
    var t=String(text).trim();
    var FENCE=String.fromCharCode(96,96,96);
    var a=t.indexOf(FENCE);
    if(a>=0){ var b=t.indexOf(FENCE, a+3); if(b>a) t=t.slice(a+3,b); }
    var s=t.indexOf("{"), e=t.lastIndexOf("}");
    if(s<0||e<0) return null;
    var obj=JSON.parse(t.slice(s,e+1));
    if(!obj || !Array.isArray(obj.tasks) || !obj.tasks.length) return null;
    var tasks=obj.tasks.map(function(tk){
      var pts=(tk.points||[]).map(function(p){
        var mins=parseInt(p.check_minutes,10);
        return { action:String(p.action||"").trim(), criteria:String(p.done_criteria||"").trim(), mins:[15,25,30,45].indexOf(mins)>=0?mins:25 };
      }).filter(function(p){ return p.action; });
      return { title:String(tk.title||"未命名任务").trim(), hint:String(tk.setup_hint||"").trim(), points:pts };
    }).filter(function(tk){ return tk.points.length || tk.title; });
    if(!tasks.length) return null;
    var qs=(obj.questions||[]).map(function(q){ return { ask:String(q.ask||""), options:(q.options||[]).map(function(o){ return String(o); }).filter(Boolean) }; }).filter(function(q){ return q.ask; });
    var ch=(obj.changes||[]).map(function(c){
      if(c.type==="add_points"){
        var pts=(c.points||[]).map(function(p){
          var mins=parseInt(p.check_minutes,10);
          return { action:String(p.action||"").trim(), criteria:String(p.done_criteria||"").trim(), mins:[15,25,30,45].indexOf(mins)>=0?mins:25 };
        }).filter(function(p){ return p.action; });
        return { type:"add_points", taskTitle:String(c.task_title||"").trim(), points:pts };
      }
      if(c.type==="delete_point"){
        return { type:"delete_point", taskTitle:String(c.task_title||"").trim(), pointTitle:String(c.point_title||"").trim() };
      }
      return null;
    }).filter(Boolean).filter(function(c){ return c.type==="add_points" ? (c.taskTitle && c.points.length) : (c.taskTitle && c.pointTitle); }).slice(0,6);
    return { tasks:tasks, changes:ch, questions:qs.slice(0,3) };
  }catch(e){ return null; }
}
function aiRenderDraft(){
  var box=$("#aiOutput"); if(!box) return;
  var h='<div class="h-label" style="margin:14px 0 8px">草案 · 每一行都可改</div>', i, j;
  for(i=0;i<AIUI.draft.length;i++){
    var t=AIUI.draft[i];
    h+='<div class="ai-task" data-i="'+i+'">';
    h+='<div class="ai-th"><input class="inp grow ai-title" value="'+esc(t.title)+'">';
    h+='<button class="iconbtn" title="删除任务" data-act="aiDelTask" data-ti="'+i+'">✕</button></div>';
    h+='<input class="inp ai-hint" style="margin-bottom:10px;font-size:12.5px" placeholder="环境预设建议（可空）：把手机放远、提前打开文件……" value="'+esc(t.hint)+'">';
    for(j=0;j<t.points.length;j++){ h+=aiPointRowHtml(i,j,t.points[j]); }
    h+='<button class="btn btn-ghost btn-sm" data-act="aiAddPoint" data-ti="'+i+'">＋ 加一个执行点</button></div>';
  }

function aiReadDraft(){

    var points=[];

      points.push({ action:a, criteria:$(".ai-crit",p).value.trim(), mins:parseInt($(".ai-mins",p).value,10)||25 });

function aiSyncButtons(loading){
  var go=$('[data-act="aiGo"]'), save=$('[data-act="aiSave"]'), regen=$('[data-act="aiRegen"]'), note=$("#aiFootNote");

async function aiRegenerate(){
  if(AIUI.genCount>=3){ toast("别再磨清单了——先动起来"); return; }
  var extra="";
  Object.keys(AIUI.answers).forEach(function(k){
    if(k.indexOf("q")===0){ var qi=parseInt(k.slice(1),10); var q=AIUI.questions[qi];
      if(q) extra+="- "+q.ask+" → "+AIUI.answers[k]+"\n"; }
  });
  var u=aiBuildUserContent(extra); if(!u) return;
  var box=$("#aiOutput");
  box.innerHTML='<div class="ai-loading"><span class="spin"></span>按你的回答重新拆……</div>';
  aiSyncButtons(true);
  var r=await callAI([{role:"system",content:AI_SYSTEM},{role:"user",content:u}]);
  if(!r.ok){ box.innerHTML='<div class="qline" style="border-color:#A8482B;background:#F6E4DC;color:#8A3B20">'+esc(r.error)+'</div>'; aiSyncButtons(); return; }
  var draft=parseAIDraft(r.text);
  if(!draft){ toast("解析失败，再试一次"); aiSyncButtons(); return; }
  AIUI.draft=draft.tasks; AIUI.questions=draft.questions||[]; AIUI.changes=draft.changes||[]; AIUI.delApprove={}; AIUI.genCount++;
  aiRenderDraft();
}
function findTaskByTitle(t){
  var tt=String(t||"").trim().toLowerCase();
  for(var i=0;i<S.tasks.length;i++){ if(String(S.tasks[i].title||"").trim().toLowerCase()===tt) return S.tasks[i]; }
  return null;
}
function findPointByTitle(taskTitle, pointTitle){
  var t=findTaskByTitle(taskTitle); if(!t) return null;
  var pp=String(pointTitle||"").trim().toLowerCase();
  for(var i=0;i<S.points.length;i++){ var p=S.points[i];
    if(p.taskId===t.id && String(p.title||"").trim().toLowerCase()===pp) return p; }
  return null;
}
function aiConfirm(startNow){
  var tasks=aiReadDraft();
  var has=false, i2;
  tasks.forEach(function(t){ if(t.points.length) has=true; });
  for(i2=0;i2<AIUI.changes.length;i2++){
    var ch2=AIUI.changes[i2];
    if(ch2.type==="add_points" && ch2.points.length) has=true;
    if(ch2.type==="delete_point" && AIUI.delApprove[i2]) has=true;
  }
  if(!has){ toast("清单是空的——至少留一个能动手的执行点，或批准一条改动"); return; }
  var firstId=null;
  tasks.forEach(function(t){
    var task={ id:uid(), title:t.title, setupHint:t.hint, archived:false, createdAt:Date.now() };
    S.tasks.push(task);
    t.points.forEach(function(p){
      var pt={ id:uid(), taskId:task.id, title:p.action, doneCriteria:p.criteria, done:false,
        checkMinutes:p.mins||null, createdAt:Date.now() };
      S.points.push(pt);
      if(!firstId) firstId=pt.id;
    });
  });
  var addedC=0, delC=0;
  AIUI.changes.forEach(function(ch, ci){
    if(ch.type==="add_points" && ch.points.length){
      var t=findTaskByTitle(ch.taskTitle);
      if(!t){ t={ id:uid(), title:ch.taskTitle, archived:false, createdAt:Date.now() }; S.tasks.push(t); }
      ch.points.forEach(function(p){
        var np={ id:uid(), taskId:t.id, title:p.action, doneCriteria:p.criteria, done:false,
          checkMinutes:p.mins||null, createdAt:Date.now() };
        S.points.push(np);
        if(!firstId) firstId=np.id;
        addedC++;
      });
    }
    if(ch.type==="delete_point" && AIUI.delApprove[ci]){
      var pt=findPointByTitle(ch.taskTitle, ch.pointTitle);
      if(pt){ S.points=S.points.filter(function(x){ return x.id!==pt.id; }); delC++; }
    }
  });
  closeModal(); persist(); renderAll();
  if(startNow && firstId){ startPoint(firstId); }
  else if(delC){ toast("清单已保存：新增 "+addedC+" 条，删除 "+delC+" 条。"); }
  else if(addedC){ toast("已挂到现有清单 "+addedC+" 条。"); }
  else toast("清单已就位。");
}

/* ============ 托盘图标 ============ */
function makeTrayIcon(){
  try{
    var c=document.createElement("canvas"); c.width=32; c.height=32;
    var g=c.getContext("2d");
    g.clearRect(0,0,32,32);
    // 橙色底盘
    g.beginPath(); g.arc(16,16,14,0,Math.PI*2); g.fillStyle="#E2602F"; g.fill();
    // 米白表盘：几乎整圈，左下角留缺口（从左侧经顶部、右侧到正下方）
    g.beginPath(); g.arc(16,16,7.5,Math.PI,Math.PI/2,false);
    g.strokeStyle="#FFF8EC"; g.lineWidth=4; g.lineCap="round"; g.stroke();
    // 指针停在缺口里（左下，"调低"档位）
    var kx=Math.cos(Math.PI*3/4), ky=Math.sin(Math.PI*3/4);
    g.beginPath(); g.moveTo(16+kx*2,16+ky*2); g.lineTo(16+kx*7,16+ky*7);
    g.strokeStyle="#FFF8EC"; g.lineWidth=4; g.lineCap="round"; g.stroke();
    // 轴心
    g.beginPath(); g.arc(16,16,1.4,0,Math.PI*2); g.fillStyle="#FFF8EC"; g.fill();
    return c.toDataURL("image/png");
  }catch(e){ return null; }
}

      case "aiAddTask": aiAddTask(); break;
      case "aiGo": if(AIUI.draft) aiConfirm(true); else aiGenerate(); break;
      case "aiSave": aiConfirm(false); break;
      case "aiRegen": aiRegenerate(); break;
      case "widgetHide": if(IS_DESKTOP) window.desktopAPI.toggleWidget(false); break;
      case "widgetOpenMain": if(IS_DESKTOP) window.desktopAPI.openMain(); break;
      case "widgetList": UI_WLIST=!UI_WLIST; renderAll(); break;
    }
  } else if(which==="change"){
    switch(act){
      case "recTask": REC_TASK=el.value; renderRecords(); break;
      case "setDefaultMinutes": setDefaultMinutes(el.value); break;
      case "setToggle": setToggle(el.getAttribute("data-key"), el.checked); break;
      case "setTheme": S.settings.theme=el.value; applyTheme(); persist(); break;
      case "setFontScale": S.settings.fontScale=parseFloat(el.value)||1; applyZoom(); persist(); break;
      case "remindToggle": S.settings.dailyRemind.enabled=el.checked; persist(); break;
      case "remindTime": S.settings.dailyRemind.time=el.value; persist(); break;
      case "pmTask": pmTaskChange(); break;
      case "rwNextChoice":
        var rcRoot = IS_WIDGET ? $("#widgetBody") : $("#reviewRoot");
        var rcSel = rcRoot ? rcRoot.querySelector("select[name=nextChoice]") : null;
        var rcInp = rcRoot ? rcRoot.querySelector("input[name=nextStep]") : null;
        if(rcInp) rcInp.style.display = (rcSel && rcSel.value==="__custom") ? "block" : "none";
        break;
    }
  } else if(which==="input"){
    if(act==="opacity") setWidgetOpacity(el.value);
  }
}
document.addEventListener("click", onAction);
document.addEventListener("change", onAction);
document.addEventListener("input", onAction);
document.addEventListener("dragstart", function(e){
  var h=e.target && e.target.closest ? e.target.closest("[data-drag-task]") : null;
  var hp=e.target && e.target.closest ? e.target.closest("[data-drag-point]") : null;
  var h2 = h || hp;
  if(!h2) return;
  try{
    e.dataTransfer.setData("text/plain", (h?"task:":"point:")+h2.getAttribute(h?"data-drag-task":"data-drag-point"));
    e.dataTransfer.effectAllowed="move";
  }catch(e2){}
  h2.classList.add("dragging");
});
document.addEventListener("dragend", function(e){
  var h=e.target && e.target.closest ? e.target.closest("[data-drag-task], [data-drag-point]") : null;
  if(h) h.classList.remove("dragging");
});
document.addEventListener("dragover", function(e){
  var c=e.target && e.target.closest ? e.target.closest('[data-act="calDrop"]') : null;
  if(!c) return;
  e.preventDefault();
  try{ e.dataTransfer.dropEffect="move"; }catch(e2){}
  c.classList.add("over");
});
document.addEventListener("dragleave", function(e){
  var c=e.target && e.target.closest ? e.target.closest('[data-act="calDrop"]') : null;
  if(c) c.classList.remove("over");
});
document.addEventListener("drop", function(e){
  var c=e.target && e.target.closest ? e.target.closest('[data-act="calDrop"]') : null;
  if(!c) return;
  e.preventDefault();
  c.classList.remove("over");
  var id="";
  try{ id=e.dataTransfer.getData("text/plain"); }catch(e2){}
  if(!id) return;
  var day=c.getAttribute("data-day")||null;
  var targetDue=null;
  if(id.indexOf("point:")===0){
    var p=pointById(id.slice(6)); if(!p) return;
    p.dueDate = (day && p.dueDate===day) ? null : day;
    targetDue=p.dueDate;
  } else {
    var t=taskById(id); if(!t) return;
    t.dueDate = (day && t.dueDate===day) ? null : day;
    targetDue=t.dueDate;
  }
  SELECTED_DAY = targetDue || SELECTED_DAY || todayKey();
  persist(); renderAll();
  toast(targetDue ? ("已挂到 "+targetDue+(targetDue===todayKey()?"（今天）":"")+"。" ) : "已摘下来。");
  var cell=$('.cal-cell[data-day="'+targetDue+'"]');
  if(cell){ cell.classList.remove("pop"); void cell.offsetWidth; cell.classList.add("pop"); }
});

/* ============ 新手引导 ============ */

  {title:"写下一个动作", body:"执行清单不是目标清单。写你手能直接伸向的动作：「打开数学53第42页，做到45页」，而不是「复习数学」。也可以把想法丢给 AI，让它帮你拆。"},
  {title:"开始，然后别想", body:"开始专注后，眼前只有倒计时和一句提示语。那句提示语是借来的理由——先做两步，后面的事后面再说。"},
  {title:"到点，把脑子接回来", body:"计时结束或你主动结束时，回答三个小问题：有没有新信息、真实推进了什么、下一步做什么。进展会自动记下，不用你再写一遍。"},
